<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q8 · 装配与运动审阅</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui,'Microsoft YaHei',sans-serif;background:#f2f3ef;color:#243630}main{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:100dvh}article{position:relative;min-height:430px}canvas{width:100%;height:100%;display:block;touch-action:none}header{position:absolute;top:20px;left:24px;pointer-events:none}h1{font-size:24px;margin:0}aside{padding:22px;overflow:auto;background:#fbfbf8;border-left:1px solid #ccd3cc}h2{font-size:17px;margin:22px 0 8px}h2:first-child{margin-top:0}button,select,input{font:inherit}button,select{border:1px solid #b7c4ba;background:white;color:#233f32;border-radius:5px;padding:6px;margin:2px}button:hover{background:#dce9e1}select{max-width:100%}label{display:block;margin:7px 0}.slide{display:grid;grid-template-columns:33px 1fr 44px;gap:5px;align-items:center}input[type=range]{width:100%;accent-color:#266b55}output{text-align:right;font-variant-numeric:tabular-nums}p{line-height:1.6;margin:7px 0}#detail{border-left:3px solid #438069;padding:5px 10px;background:#eaf1e9;overflow-wrap:anywhere}#info{position:absolute;bottom:10px;left:18px;font-size:13px}small{color:#576c60}.sep{border-top:1px solid #d0dacd;margin-top:16px;padding-top:4px}@media(max-width:760px){main{display:block;height:auto}article{height:54dvh}aside{border:0}} </style><main><article id="view"><header><h1>Q8 整车装配审阅</h1><small>R5 · SolidWorks 名义刚体几何</small></header><div id="info">拖动旋转，滚轮缩放，单击零件识别。</div></article><aside><h2>四角姿态</h2><div id="sliders"></div><button id="crouch">下蹲</button><button id="ride">巡航</button><button id="extend">蹬伸终点</button><button id="single">左前抬腿</button><button id="diag">对角极位</button><button id="play">同步蹬伸</button><h2>装配层</h2><label><input type=checkbox id="mid"> MID360 选装</label><label><input type=checkbox id="cover"> 隐藏上板看下舱</label><label><input type=checkbox id="wire"> 显示布线</label><label><input type=checkbox checked id="screws"> 显示紧固件</label><h2>零件与安装位置</h2><select id="pick"><option value="">选择零件或线号</option></select><p id="detail">可单击三维模型中的轮腿、模块、安装支架和紧固件。</p><div class="sep"><h2>干涉审阅</h2><select id="pairs" aria-label="检查零件组合"><option value="">查看整车</option></select><p id="results"></p><small>六条固定线路已按新支架重新绕行。拖动姿态时，活动束跟随所属轮腿。实际接头、扎带和线材形变需装车复核。</small></div></aside></main><script>__THREE__</script><script>const V=__DATA__,get=id=>document.getElementById(id),names=['左前','右前','左后','右后'],keys=['FL','FR','RL','RR'];let angles=[-7,-7,-7,-7],playing=false,start=0,az=.7,el=.52,scale=1,selected=null;
const view=get('view'),scene=new THREE.Scene(),cam=new THREE.OrthographicCamera(-400,400,400,-400,.1,3200),render=new THREE.WebGLRenderer({antialias:true});render.setPixelRatio(Math.min(devicePixelRatio,2));view.prepend(render.domElement);scene.background=new THREE.Color(0xe4eae2);cam.up.set(0,0,1);scene.add(new THREE.HemisphereLight(0xffffff,0x99a49c,1.08));const sun=new THREE.DirectionalLight(0xfff9e9,1);sun.position.set(400,-300,650);scene.add(sun);const G={},hit=[],legs=[],wires=[],list=get('pick'),tag=new Map(),rad=Math.PI/180;
function geometry(k){let p=V.mesh[k];let unpack=(str,T)=>new T(Uint8Array.from(atob(str),c=>c.charCodeAt(0)).buffer);let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(unpack(p[0],Float32Array),3));g.setIndex(new THREE.BufferAttribute(unpack(p[1],Uint32Array),1));g.computeVertexNormals();return G[k]=g}

for(const t of V.items){const info=V.meta[t.id],o=part(t.id,scene,t.name,info[0],info[1],info[2]);o.position.set(...t.pos);o.rotation.set(t.up?Math.PI:0,0,t.rz*rad,'ZYX');Object.assign(o.userData,{opt:t.optional,deck:t.id==='Deck',bolt:info[3]})}
for(let j=0;j<4;j++){let side=j%2?1:-1,front=j<2?1:-1,root=new THREE.Group();root.matrixAutoUpdate=false;root.matrix.set(0,0,side,119*side,front,0,0,112*front,0,1,0,0,0,0,0,1);scene.add(root);let group={};for(let k of ['base','drive','passive','carrier','wheel']){group[k]=new THREE.Group();root.add(group[k])}legs.push(group);V.inst.forEach((t,i)=>{let [title,color]=V.legmeta[t.id];let o=part(t.id,group[t.g],keys[j]+'_'+t.id+'_'+i,title,names[j]+'轮腿 · '+t.g,color);o.position.set(t.x,t.y,t.z);o.rotation.set(t.flip?Math.PI:0,0,t.rot*rad,'ZYX')})}
for(const w of V.wiring.routes){let pts=w.points,g=new THREE.BufferGeometry().setFromPoints(pts.map(p=>new THREE.Vector3(...p)));let o=new THREE.Line(g,new THREE.LineBasicMaterial({color:w.frames?0x965919:0x244d88}));scene.add(o);register(o,w.id,w.id+' '+w.group,V.wiring.nodes[w.a].label+' → '+V.wiring.nodes[w.b].label);o.userData.line=true;o.userData.opt=w.optional;wires.push([o,w])}
let focusIds=null;for(const [i,v] of V.pairs.entries())get('pairs').append(new Option(v[0],i));get('pairs').onchange=()=>{let k=get('pairs').value;focusIds=k===''?null:new Set(V.pairs[k][1]);if(focusIds){for(let id of focusIds){let d=tag.get(id)?.userData;if(d?.opt)get('mid').checked=true;if(d?.line)get('wire').checked=true}get('cover').checked=false;get('screws').checked=true;get('detail').textContent=V.pairs[k][2]}draw()};
function select(id){if(selected?.material.emissive)selected.material.emissive.setHex(0);focusIds=null;get('pairs').value='';selected=tag.get(id);if(selected){const d=selected.userData;if(d.opt)get("mid").checked=true;if(d.line)get("wire").checked=true;if(d.bolt)get("screws").checked=true;if(d.deck)get("cover").checked=false;if(selected.material.emissive)selected.material.emissive.setHex(0xad520d);get('detail').textContent=selected.userData.title+'　'+id+'　'+selected.userData.description;list.value=id}draw()}

legs.forEach((g,i)=>{const q=angles[i]*rad;g.drive.rotation.z=-q;g.passive.position.y=-62;g.passive.rotation.z=-q;for(let k of ['carrier','wheel'])g[k].position.set(110*Math.cos(q),-110*Math.sin(q),0);get('a'+i).value=angles[i];get('v'+i).value=angles[i].toFixed(0)+'°'});for(let [o,w] of wires){if(!w.frames||!o.visible)continue;let j=keys.findIndex(k=>(w.a+' '+w.b+' '+w.detail).includes(k)),v=angles[j<0?0:j]+36,i=Math.floor(v),b=Math.min(w.frames.length-1,i+1);let pos=o.geometry.attributes.position;w.frames[i].forEach((a,n)=>{let t=w.frames[b][n];pos.setXYZ(n,...a.map((x,k)=>x+(t[k]-x)*(v-i)))});pos.needsUpdate=true;o.geometry.computeBoundingSphere()}render.render(scene,cam)}
names.forEach((n,i)=>{let l=document.createElement('label');l.className='slide';l.innerHTML=n+'<input aria-label="'+n+'髋角" id="a'+i+'" type="range" min="-36" max="22" step="1" value="-7"><output id="v'+i+'"></output>';get('sliders').append(l);get('a'+i).oninput=e=>{stop();angles[i]=Number(e.target.value);draw()}});function stop(){playing=false;get('play').textContent='同步蹬伸'}function tick(t){if(!playing)return;let u=Math.min(1,(t-start)/1800);angles.fill(-36+58*(3*u*u-2*u*u*u));draw();if(u<1)requestAnimationFrame(tick);else stop()}get('play').onclick=()=>{if(playing)return stop();playing=true;start=performance.now();get('play').textContent='暂停';requestAnimationFrame(tick)};for(const [id,qs] of Object.entries({crouch:[-36,-36,-36,-36],extend:[22,22,22,22],single:[-36,-7,-7,-7]})){get(id).onclick=()=>{stop();angles=qs.slice();draw()}}get('ride').onclick=()=>{stop();angles.fill(-7);draw()};get('diag').onclick=()=>{stop();angles=[-36,22,22,-36];draw()};for(const a of ['wire','mid','cover','screws'])get(a).onchange=draw;list.onchange=()=>select(list.value);const canvas=render.domElement,ray=new THREE.Raycaster();ray.params.Line.threshold=1.8;let drag=null;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY,az,el];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;az=drag[2]-(e.clientX-drag[0])*.009;el=Math.max(-1.48,Math.min(1.48,drag[3]+(e.clientY-drag[1])*.008));draw()};canvas.onpointerup=e=>{if(!drag)return;if(Math.hypot(e.clientX-drag[0],e.clientY-drag[1])<4){let r=canvas.getBoundingClientRect();ray.setFromCamera(new THREE.Vector2(2*(e.clientX-r.left)/r.width-1,1-2*(e.clientY-r.top)/r.height),cam);let p=ray.intersectObjects(hit.filter(o=>o.visible),false)[0];if(p)select(p.object.userData.id)}drag=null};canvas.onwheel=e=>{e.preventDefault();scale=Math.max(.55,Math.min(4,scale*Math.exp(-e.deltaY*.0015)));draw()};get('results').textContent=V.note;new ResizeObserver(draw).observe(view);draw();</script></html>
